name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      # Same engine as Netlify Database, so the API tests also run on Postgres.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tw
          POSTGRES_PASSWORD: tw
          POSTGRES_DB: tankwijzer_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tw" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_PG_URL: postgres://tw:tw@localhost:5432/tankwijzer_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm --filter @tankwijzer/api bundle:netlify
